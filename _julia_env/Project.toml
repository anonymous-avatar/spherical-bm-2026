# Shared Julia environment for every Julia figure / simulation script in
# accompanying-code. Activate with `Pkg.activate(joinpath(@__DIR__, "..",
# "_julia_env"))` (or run the bundled `setup.jl` once); each figure script
# already contains the activation prologue.
#
# The local slim copy of UndersampledSphericalBMs2025 (under ../_lib/) is
# wired in via `Pkg.develop` in `setup.jl` rather than as a registry dep,
# so no Manifest.toml is shipped — first-run `Pkg.instantiate()` resolves
# everything from this Project.toml.

[deps]
